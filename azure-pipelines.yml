# Root-level CI pipeline using shared templates from octo-pipeline-templates.
#
# This pipeline coexists with devops-build/azure-pipelines.yml during the
# Phase 1 pilot of the YAML migration (see octo-mesh-deployment's
# docs/pipeline-architecture-concept.md). A new ADO build definition pointing
# at THIS file runs in parallel with the legacy CI; once two green runs land
# on main + a test branch, the legacy CI and devops-build/ can be removed.

name: $(MajorVersion).$(MinorVersion).$(date:yyMM).$(DayOfMonth)$(rev:rrr)-$(Build.SourceBranchName)

parameters:
  # Injected by the release train on r-tag builds so the whole chain pins the
  # scheduler-determined lib/comm release version (forwarded to
  # update-build-number.yml). Default 'auto' = no override (version computed
  # normally); the train injects the real version on r-tag.
  - name: octoCoreLibVersion
    type: string
    default: 'auto'
  - name: octoCommVersion
    type: string
    default: 'auto'

resources:
  # Chain link: exactly ONE upstream pipeline resource per repo. Pipeline
  # resource triggers do NOT batch, so a repo with two trigger parents is
  # started twice per main cascade. The chain is therefore a single-parent
  # tree; artificial ordering edges (marked below) resolve real DAG joins.
  # Full picture: octo-mesh-deployment/pipelines/orchestrator-ci.yml.
  # Meshmakers.Common.* is the base of the whole .NET tree.
  pipelines:
    - pipeline: mm-common
      source: mm-common-CI
      trigger:
        branches:
          include:
            - main
  repositories:
    - repository: pipelineTemplates
      type: github
      name: meshmakers/octo-pipeline-templates
      endpoint: meshmakers-access-token
      ref: refs/tags/tpl-v0.6.6

trigger:
  batch: true
  branches:
    include:
      - dev/*
      - test/*
      - main
  # Docs-only commits must not start CI (AB#5719). Excluded paths are
  # never consumed by the build; a root README.md change reaches the
  # packed NuGet readme with the next code commit.
  paths:
    exclude:
      - '**/*.md'
      - '*.md'
      - '.claude/'
      - 'docs/'
  tags:
    exclude:
      - '*'

variables:
  - group: ApiKeys-mm-cloud
  - group: OctoDefault
  - name: buildConfiguration
    value: 'Release'
  - name: buildPlatform
    value: 'Any CPU'
  - name: isRelease
    value: ${{ startsWith(variables['Build.SourceBranch'], 'refs/tags/r') }}
  - name: isMain
    value: ${{ eq(variables['Build.SourceBranch'], 'refs/heads/main') }}
  - name: isTest
    value: ${{ startsWith(variables['Build.SourceBranch'], 'refs/heads/test') }}

stages:
  - stage: Build
    jobs:
      - job: buildAndTest
        displayName: 'Build nuget and execute tests'
        pool:
          name: meshmakers-ci-agents
        steps:
          - template: templates/steps/update-build-number.yml@pipelineTemplates
            parameters:
              octoCoreLibVersionOverride: ${{ replace(parameters.octoCoreLibVersion, 'auto', '') }}
              octoCommVersionOverride: ${{ replace(parameters.octoCommVersion, 'auto', '') }}
          - checkout: self
            clean: true
            submodules: true
          - template: templates/steps/set-version.yml@pipelineTemplates
          - task: DotNetCoreCLI@2
            retryCountOnTaskFailure: 2
            # Builds the test projects too, so the Test step can run with
            # --no-build --no-restore and no longer recompiles src + tests once per
            # test project (AB#6093, same layout as octo-construction-kit-engine).
            displayName: 'Build src and tests'
            inputs:
              command: 'build'
              projects: |
                src/**/*.csproj
                tests/**/*Tests.csproj
                !tests/**/*SystemTests.csproj
              arguments: '--configuration $(buildConfiguration) /p:OctoNugetPrivateServer=$(nugetPrivateServer)'
          - task: DotNetCoreCLI@2
            retryCountOnTaskFailure: 2
            displayName: 'Test'
            inputs:
              command: 'test'
              # One `dotnet test` per project, sequentially (DotNetCoreCLI default) —
              # the integration tests use Testcontainers inside the DinD sidecar.
              arguments: '--configuration $(buildConfiguration) --no-build --no-restore /p:OctoNugetPrivateServer=$(nugetPrivateServer)'
              projects: |
                **/*Tests.csproj
                !**/*SystemTests.csproj
              testRunTitle: 'CI'
          - template: templates/steps/handle-artifacts.yml@pipelineTemplates
          - template: templates/steps/push-nuget-package.yml@pipelineTemplates
